name = "vpngate-mihomo-browser"
main = "worker.js"
compatibility_date = "2026-07-08"

# 本项目不自动创建 Cloudflare 资源。
# 使用 Wrangler 部署时,请先手动创建 KV namespace,再取消注释并填写实际 ID:
# [[kv_namespaces]]
# binding = "SUBSCRIPTIONS"
# id = "YOUR_KV_NAMESPACE_ID"
#
# 通过 Cloudflare 控制台部署时无需填写这里:
# 在 Worker → Settings → Bindings 中手动绑定现有 KV namespace,
# binding 变量名必须为 SUBSCRIPTIONS。

# 免费额度足够个人使用。如果你有自己的域名并想绑定,
# 可以在 Cloudflare 控制台的 Workers 路由设置中添加,
# 或者取消下面的注释并填入你的域名(需先在该账号下托管该域名):
# routes = [
#   { pattern = "vpngate.yourdomain.com", custom_domain = true }
# ]
